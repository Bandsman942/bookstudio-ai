name: BookStudio immutable v0.4.0 tag
on:
  push:
    branches: [ops/52-tag-v0.4.0]
permissions:
  contents: write
jobs:
  tag-release:
    if: github.repository == 'Bandsman942/bookstudio-ai' && github.ref == 'refs/heads/ops/52-tag-v0.4.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Annotate verified production commit
        env:
          RELEASE_SHA: 227290fdf29baece2db64f7811363fd9168fb3bf
          RELEASE_TAG: v0.4.0
        run: |
          set -euo pipefail
          git fetch origin "$RELEASE_SHA" --no-tags
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
          if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to replace immutable tag."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "BookStudio AI v0.4.0-alpha — READY dpl_7KDgWfnZE5zzmgh229LsXTjWuccQ"
          git push origin "refs/tags/$RELEASE_TAG"
