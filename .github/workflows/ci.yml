name: BookStudio CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://fake:fake@localhost:5432/bookstudio
          DIRECT_URL: postgresql://fake:fake@localhost:5432/bookstudio
          BOOKSTUDIO_PUBLIC_SIGNUP: 'false'
