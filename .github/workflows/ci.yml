name: BookStudio CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bookstudio
          POSTGRES_USER: bookstudio_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookstudio_ci -d bookstudio"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://bookstudio_ci:ci_only_password@localhost:5432/bookstudio?schema=public
      DIRECT_URL: postgresql://bookstudio_ci:ci_only_password@localhost:5432/bookstudio?schema=public
      BOOKSTUDIO_PUBLIC_SIGNUP: 'false'
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
      - run: python -m unittest discover -s apps/worker-documents/tests -v
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm typecheck
      - run: pnpm build
