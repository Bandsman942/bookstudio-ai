name: BookStudio annotate immutable release v0.3.0
on:
  push:
    branches: [ops/47-tag-v0.3.0]
permissions:
  contents: write
jobs:
  create-tag:
    if: github.repository == 'Bandsman942/bookstudio-ai' && github.ref == 'refs/heads/ops/47-tag-v0.3.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Tag the exact Vercel READY commit
        env:
          DEPLOYED_SHA: cb6f4e39d011306d06172c83e160f6771fcb0daf
          RELEASE_TAG: v0.3.0
        run: |
          set -euo pipefail
          git fetch origin "$DEPLOYED_SHA" --no-tags
          test "$(git rev-parse FETCH_HEAD)" = "$DEPLOYED_SHA"
          if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Existing release tag kept immutable"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$DEPLOYED_SHA" -m "BookStudio AI v0.3.0-alpha — READY dpl_EqQjVJCfzuDX3BbvxX1fppMxXFUU"
          git push origin "refs/tags/$RELEASE_TAG"
