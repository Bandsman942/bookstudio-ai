name: BookStudio tag v0.5.0 deployed commit
on:
  push:
    branches: [ops/58-tag-v0.5.0]
permissions:
  contents: write
jobs:
  tag-release:
    if: github.repository == 'Bandsman942/bookstudio-ai' && github.ref == 'refs/heads/ops/58-tag-v0.5.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Annotate exact verified production commit
        env:
          DEPLOYED_SHA: be62cb8f5e161090e855986b89bdf0ff121b1623
          RELEASE_TAG: v0.5.0
        run: |
          set -euo pipefail
          git fetch origin "$DEPLOYED_SHA" --no-tags
          test "$(git rev-parse FETCH_HEAD)" = "$DEPLOYED_SHA"
          if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Existing release tag is immutable"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$DEPLOYED_SHA" -m "BookStudio AI v0.5.0-alpha — READY dpl_35aB6LZsC2jXV3dnp5KX1su9T3Rt"
          git push origin "refs/tags/$RELEASE_TAG"
