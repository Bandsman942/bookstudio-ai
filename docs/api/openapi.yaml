openapi: 3.1.0
info:
  title: BookStudio AI API
  version: 0.1.0
  description: >-
    API autonome, aucune connexion directe à DTSC Platform. v0.42.0-alpha
    ajoute le déplacement transactionnel d'une partie entière avec contrôle
    optimiste de l'ordre, sans modifier les révisions de texte.
servers:
  - url: /api/v1
paths:
  /books/{bookId}/parts:
    get:
      summary: Lister les parties de l'édition courante autorisée (v0.41)
      description: Réponse privée sans texte, tri création/UUID, cache no-store.
      parameters:
        - name: bookId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: 'editionId, orderToken SHA-256 ordre/affectations, parts[]: id, title, updatedAt'}
        '401': {description: Session requise}
        '404': {description: Livre inaccessible ou archivé}
        '503': {description: Parties temporairement indisponibles}
    post:
      summary: Créer une partie vide dans le manuscrit courant
      description: >-
        OWNER/EDITOR uniquement, Origin identique, JSON title validé (2–180)
        et expectedEditionId courant, limite 100 parties. Verrou livre,
        transaction Serializable, audit et cache privé.
      responses:
        '201': {description: Partie créée}
        '400': {description: Paramètres invalides}
        '401': {description: Session manquante}
        '403': {description: Origine invalide}
        '404': {description: Rôle insuffisant ou livre absent}
        '409': {description: Édition périmée ou écriture concurrente}
        '422': {description: Limite 100 parties atteinte}
        '503': {description: Erreur base temporaire}
  /books/{bookId}/parts/{partId}:
    patch:
      summary: Renommer une partie de l'édition courante
      description: >-
        OWNER/EDITOR et Origin. title validé, expectedEditionId et
        expectedUpdatedAt ISO de la partie; 409 si conflit, audit.
      responses:
        '200': {description: Métadonnées renommées, aucun texte modifié}
        '400': {description: Titre ou préconditions invalides}
        '401': {description: Session requise}
        '403': {description: Origin rejeté}
        '404': {description: Partie non trouvée dans l'édition actuelle}
        '409': {description: Version de partie ou édition périmée}
    delete:
      summary: Supprimer une partie uniquement si elle est vide
      description: >-
        Même contrôles avec confirm DELETE_EMPTY_PART, expectedEditionId,
        expectedUpdatedAt. Refus 409 si des chapitres actifs ou retirés
        y sont encore rattachés. Jamais de suppression de chapitre.
      responses:
        '200': {description: Partie vide supprimée}
        '409': {description: Partie non vide ou précondition périmée}
        '404': {description: Partie ou permission absente}
  /books/{bookId}/parts/{partId}/move:
    patch:
      summary: Déplacer une partie entière avec ses chapitres (v0.42)
      description: >-
        OWNER/EDITOR uniquement, Origin autorisé, livre actif et édition courante.
        Échange atomiquement le bloc de chapitres d'une partie avec la plage
        voisine (autre partie ou non affectés), sans changer partId ni la prose,
        les révisions, commentaires ou snapshots. Le token SHA-256 protège
        l'ordre actif ET les affectations de parties ; les positions sont réécrites en deux phases SQL dans
        une transaction Serializable, sans collision avec les chapitres retirés.
        Audit sans contenu, cache private no-store, maximum 2000 chapitres actifs.
      parameters:
        - name: bookId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: partId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [direction, expectedEditionId, expectedOrderToken]
              properties:
                direction: {type: string, enum: [up, down]}
                expectedEditionId: {type: string, format: uuid}
                expectedOrderToken: {type: string, minLength: 64, maxLength: 64, pattern: '^[0-9a-f]{64}$'}
      responses:
        '200': {description: 'ok true, changedChapters, orderToken recalculé'}
        '400': {description: Corps/paramètre invalide}
        '401': {description: Authentification requise}
        '403': {description: Origin rejeté}
        '404': {description: Partie, livre ou droits insuffisants}
        '409': {description: 'BOOK_PART_ORDER_CONFLICT ou BOOK_PART_MOVE_UNAVAILABLE'}
        '422': {description: 'BOOK_PART_ORDER_TOO_LARGE, limite ou capacité int32'}
        '503': {description: Mutation temporairement indisponible}
  /books/{bookId}/chapters/{chapterId}/part:
    patch:
      summary: Affecter ou détacher un chapitre d'une partie de l'édition courante
      description: >-
        JSON partId UUID ou null, expectedEditionId et
        expectedChapterUpdatedAt ISO. Valide que la partie appartient au
        même manuscrit et que chaque partie forme une séquence contiguë
        dans l'ordre actuel. OWNER/EDITOR, Origin, verrou livre, transaction
        Serializable. Ne modifie ni prose ni revisionSeq.
      responses:
        '200': {description: 'ok, changed; metadata de chapitre mise à jour'}
        '400': {description: Requête invalide}
        '401': {description: Non authentifié}
        '403': {description: Origin rejeté}
        '404': {description: Chapitre/partie inaccessible ou rôle insuffisant}
        '409': {description: Édition/concurrence/continuité BOOK_PART_NOT_CONTIGUOUS}
        '422': {description: Taille de manuscrit trop grande pour la vérification}
        '503': {description: Mutation indisponible}
  /auth/login:
    post:
      summary: Authentification locale
      responses:
        '200': {description: Session établie}
        '401': {description: Identifiants invalides}
  /auth/logout:
    post:
      summary: Révoquer la session
      responses:
        '200': {description: Révoquée}
  /books:
    get:
      summary: Bibliothèque privée paginée avec recherche de titre et filtres
      description: >-
        Ne retourne que les livres dont l'utilisateur courant est membre de l'espace.
        Curseur keyset lié aux filtres, tri déterministe; statistiques de la
        bibliothèque accessibles indépendantes de la page demandée.
      parameters:
        - name: archived
          in: query
          schema: {type: string, const: '1'}
          description: Archives réversibles uniquement; absence = livres actifs
        - name: editable
          in: query
          schema: {type: string, const: '1'}
          description: Filtre OWNER ou EDITOR pour la destination des imports
        - name: q
          in: query
          schema: {type: string, maxLength: 80}
          description: Texte recherché dans le titre (insensible à la casse)
        - name: type
          in: query
          schema: {type: string, enum: [GENERAL,NOVEL,ESSAY,SCIENCE,MEDICINE,EDUCATION]}
        - name: status
          in: query
          schema: {type: string, enum: [DRAFT,WRITING,REVIEW,APPROVED,PRODUCTION,PUBLISHED]}
        - name: sort
          in: query
          schema: {type: string, enum: [recent,title], default: recent}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
          description: UI bibliothèque utilise 24; absence garde la compatibilité 100
        - name: cursor
          in: query
          schema: {type: string, maxLength: 850}
          description: Curseur renvoyé par la page précédente et valable pour les mêmes filtres
      responses:
        '200': {description: 'books[], total filtré, nextCursor (ou null), stats globales (total/writing/review, archived, byStatus des six étapes)'}
        '400': {description: 'Filtre, limite ou curseur invalide/non applicable'}
        '401': {description: Non authentifié}
        '503': {description: Lecture temporairement indisponible}
    post:
      summary: Créer un livre, une édition et un premier chapitre
      responses:
        '201': {description: Créé}
  /books/{bookId}/chapters:
    post:
      summary: Ajouter un chapitre
      parameters:
        - name: bookId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '201': {description: Créé}
  /books/{bookId}/chapters/{chapterId}:
    get:
      summary: Lire la révision courante
      parameters:
        - name: bookId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: chapterId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Contenu structuré}
        '404': {description: Introuvable ou inaccessible}
    patch:
      summary: Sauvegarde optimiste
      parameters:
        - name: bookId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: chapterId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseRevision,content]
              properties:
                baseRevision: {type: integer, minimum: 0}
                content: {type: object}
      responses:
        '200': {description: Révision incrémentée}
        '409': {description: Conflit de révision}

  /books/{bookId}/chapters/reorder:
    patch:
      summary: Déplacer un chapitre d'une position (OWNER/EDITOR uniquement)
      description: >-
        Conserve le texte, les révisions, commentaires et snapshots. Compare
        expectedOrderToken à l'ordre courant des chapitres actifs ; 409 si une
        autre modification est intervenue. Transaction sérialisable et audit.
      parameters:
        - name: bookId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [chapterId, direction, expectedOrderToken]
              properties:
                chapterId: {type: string, format: uuid}
                direction: {type: string, enum: [up, down]}
                expectedOrderToken: {type: string, minLength: 64, maxLength: 64, pattern: '^[0-9a-f]{64}$'}
      responses:
        '200': {description: 'Ordre mis à jour ou déplacement impossible aux extrémités (changed=false), nouveau orderToken'}
        '400': {description: Paramètres non valides}
        '401': {description: Non authentifié}
        '403': {description: Origine CSRF refusée}
        '404': {description: Non membre ou livre/chapitre inaccessible}
        '409': {description: Ordre modifié par une autre session}
        '422': {description: Structure trop volumineuse}
        '503': {description: Incident temporaire, aucune décision partielle commitée}

  /books/{bookId}:
    patch:
      summary: Gérer titre, archivage, propriétés ou statut éditorial d'un livre
      description: >-
        Session + RBAC OWNER/EDITOR, CSRF par Origin, livre/espace vérifié,
        expectedUpdatedAt obligatoire, transaction Serializable et audit.
        Le statut éditorial déclaré manuellement ne publie rien.
      parameters:
        - name: bookId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action,expectedUpdatedAt,bookType,language]
                  properties:
                    action: {type: string, const: properties}
                    expectedUpdatedAt: {type: string, format: date-time}
                    bookType: {type: string, enum: [GENERAL,NOVEL,ESSAY,SCIENCE,MEDICINE,EDUCATION]}
                    language: {type: string, enum: [fr,en]}
                - type: object
                  required: [action,expectedUpdatedAt,status]
                  properties:
                    action: {type: string, const: status}
                    expectedUpdatedAt: {type: string, format: date-time}
                    status: {type: string, enum: [DRAFT,WRITING,REVIEW,APPROVED,PRODUCTION,PUBLISHED]}
                - type: object
                  required: [action,expectedUpdatedAt]
                  properties:
                    action: {type: string, enum: [rename,archive,restore]}
                    expectedUpdatedAt: {type: string, format: date-time}
                    title: {type: string, minLength: 2, maxLength: 180}
      responses:
        '200': {description: Métadonnées enregistrées ou unchanged=true}
        '400': {description: Type, langue, statut ou autre paramètre invalide}
        '401': {description: Non authentifié}
        '403': {description: Origine CSRF refusée}
        '404': {description: Livre absent/inaccessible, statut interdit sur livre archivé}
        '409': {description: Conflit de métadonnées ou d'archivage}
        '413': {description: Corps de requête trop grand}
        '422': {description: Transition éditoriale non autorisée}
        '503': {description: Échec transactionnel temporaire}

  /books/{bookId}/progress:
    get:
      summary: Indicateurs privés de progression de l'ouvrage actif
      description: >-
        Réautorise la session et l'appartenance au workspace. Utilise la dernière
        révision enregistrée de chaque chapitre actif de l'édition courante et
        ne renvoie aucun texte ni fichier source. Le pourcentage signifie
        « chapitres contenant du texte », pas « achèvement éditorial ».
      parameters:
        - name: bookId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: 'progress: editionNumber, activeChapters, writtenChapters, emptyChapters, writingCoveragePercent, removedChapters, revisionRecords, snapshots, lastRevisionAt, latestChapter, chapterStates'}
        '401': {description: Non authentifié}
        '404': {description: Livre absent, archivé ou extérieur au workspace}
        '503': {description: Statistiques indisponibles temporairement, édition du livre toujours possible}

  /books/{bookId}/editions:
    get:
      summary: Catalogue des éditions privées d'un ouvrage non archivé
      description: Session active et appartenance au workspace requises. Métadonnées seulement, sans prose manuscrite ni sources.
      parameters:
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 'editions[], currentEditionId, expectedUpdatedAt, status'}
        '401': {description: Non authentifié}
        '404': {description: Livre absent ou non autorisé}
        '503': {description: Base temporairement indisponible}
    post:
      summary: Créer l'édition suivante à partir du dernier texte enregistré
      description: >-
        OWNER/EDITOR seulement, Origin CSRF strict, copie atomique Serializable
        des chapitres actifs et dernières révisions en nouveaux identifiants.
        Ne copie pas commentaires, imports ou scans, ne modifie jamais les anciennes
        révisions ni snapshots. Le statut du livre revient à DRAFT. Capacité
        synchrone maximale 500 chapitres et 20 MiB de contenu.
      parameters:
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm,expectedEditionId,expectedUpdatedAt]
              properties:
                confirm: {type: string, const: CREATE_EDITION_FROM_SAVED}
                expectedEditionId: {type: string, format: uuid}
                expectedUpdatedAt: {type: string, format: date-time}
      responses:
        '201': {description: Nouvelle édition et nombre de chapitres copiés}
        '400': {description: Confirmation ou corps invalide}
        '401': {description: Non authentifié}
        '403': {description: Origine non autorisée}
        '404': {description: Livre inaccessible ou non modifiable}
        '409': {description: Édition modifiée ou source incohérente}
        '413': {description: Requête trop volumineuse}
        '422': {description: Plus de 500 chapitres ou 20 MiB — traitement direct indisponible}
        '503': {description: Erreur d'opération temporaire}
  /books/{bookId}/editions/{editionId}:
    get:
      summary: Sommaire historique d'une édition (lecture seule)
      parameters:
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: editionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Édition et chapitres actifs avec métadonnées seulement}
        '401': {description: Non authentifié}
        '404': {description: Édition absente ou non autorisée}
        '503': {description: Lecture indisponible}
  /books/{bookId}/editions/{editionId}/chapters/{chapterId}:
    get:
      summary: Dernier texte enregistré d'un ancien chapitre (lecture seule)
      description: Session et accès au livre réautorisés ; aucun HTML ni opération de mutation.
      parameters:
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: editionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: chapterId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 'chapter: titre, révision, texte brut, date d’enregistrement'}
        '401': {description: Non authentifié}
        '404': {description: Chapitre/édition non autorisé ou absent}
        '409': {description: Source du chapitre incohérente}
        '503': {description: Lecture temporairement indisponible}

  /books/{bookId}/editions/compare:
    get:
      summary: Comparaison privée des métadonnées et empreintes de deux éditions
      description: >-
        Membres autorisés du livre non archivé seulement. L'API lit les dernières
        empreintes des chapitres actifs de deux éditions du MÊME ouvrage et ne
        renvoie ni prose, ni JSON ProseMirror, ni hash de contenu. Elle rapporte
        les rapprochements certains par preuves uniques et les ambiguïtés
        sous forme d'ajouts et absences, sans inventer une filiation éditoriale.
      parameters:
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: to, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: "fromEdition, toEdition, comparison avec counts/pairs/added/removed/limitations (sans texte, hash ni URL)"}
        '400': {description: Edition absente ou identique / paramètre invalide}
        '401': {description: Non authentifié}
        '404': {description: Livre ou éditions absents/hors workspace}
        '409': {description: Dernière révision d'un chapitre incohérente}
        '422': {description: Plus de 350 chapitres actifs dans une édition}
        '503': {description: Comparaison temporairement indisponible}


  /books/{bookId}/snapshots/{snapshotId}/restore-as-edition:
    post:
      summary: Recréer un snapshot nommé (même ancien) dans une édition indépendante
      description: >-
        Crée atomiquement des chapitres et révisions 0 dans une nouvelle édition
        courante sans écraser aucun manuscrit existant. OWNER/EDITOR uniquement,
        Origin CSRF, double précondition sur le livre et son édition courante,
        manifeste SHA256 et révisions référencées contrôlés. Le statut revient à
        DRAFT, aucune source externe/commentaire/validation copiée. Les versions
        historiques restent accessibles et exportables. Sans prose dans la réponse.
        Limites synchrones 500 chapitres et 20 MiB. L'ancienne restauration en
        place reste séparée et requiert les numéros de révision courants.
      parameters:
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: snapshotId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm, expectedEditionId, expectedUpdatedAt]
              properties:
                confirm: {type: string, const: RESTORE_SNAPSHOT_AS_NEW_EDITION}
                expectedEditionId: {type: string, format: uuid}
                expectedUpdatedAt: {type: string, format: date-time}
      responses:
        '201': {description: 'edition: id, number, language, chapterCount ; sourceSnapshotId'}
        '400': {description: Confirmation, ID, date ou propriété invalide}
        '401': {description: Session absente}
        '403': {description: Origine CSRF invalide}
        '404': {description: Livre/snapshot absent, archivé ou non autorisé}
        '409': {description: Edition modifiée ou snapshot/source incomplet ou corrompu}
        '413': {description: Corps JSON supérieur à 2048 octets}
        '422': {description: Snapshot trop volumineux pour copie synchrone}
        '503': {description: Indisponibilité temporaire sans écriture partielle}


  /books/{bookId}/chapters/{chapterId}/revisions:
    get:
      summary: Historique privé paginé des révisions enregistrées du chapitre courant
      description: >-
        Appartenance au workspace requise. Ne retourne aucun manuscrit ni hash ;
        séquence, date et nom de l'auteur uniquement. Navigation keyset décroissante,
        limite 20 par défaut/50 maximum. Pas de lecture d'un chapitre d'édition historique
        par ce chemin : utiliser l'API historique d'éditions distincte.
      parameters:
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: chapterId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - {name: before, in: query, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: 'chapterId, title, currentRevision, revisions[] (sequence, createdAt, authorName), nextBefore'}
        '400': {description: Paramètre de pagination ou identifiant invalide}
        '401': {description: Non connecté}
        '404': {description: Livre ou chapitre courant inaccessible}
        '503': {description: Erreur de consultation du registre}
  /books/{bookId}/chapters/{chapterId}/revisions/{sequence}:
    get:
      summary: Aperçu en texte brut de la révision historique enregistrée
      description: >-
        Lecture sur demande, après contrôle session/workspace/édition courante,
        texte brut rendu échappé par le client. Cache private/no-store.
      parameters:
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: chapterId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: sequence, in: path, required: true, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: 'revision: sequence, title, authorName, recordedAt, text, isCurrent'}
        '400': {description: Numéro de révision invalide}
        '401': {description: Session absente}
        '404': {description: Révision hors du chapitre/édition courante, introuvable}
        '409': {description: Source de révision manquante ou incohérente}
        '503': {description: Lecture temporairement indisponible}
    post:
      summary: Restaurer une ancienne révision dans une NOUVELLE révision courante
      description: >-
        OWNER/EDITOR, confirmation RESTORE_CHAPTER_REVISION, expectedRevision exact,
        Origin anti-CSRF. Verrou livre FOR UPDATE puis contrôle de l'édition courante
        sous transaction Serializable. Copie sans mutation de la révision source,
        incrément de séquence, audit auteur/date/fromSequence/toSequence (sans prose),
        statut livre DRAFT. Ancien onglet déphasé refuse 404/409. Rejet du numéro
        courant 422. Historique original intact; pas de réécriture IA.
      parameters:
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: chapterId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: sequence, in: path, required: true, schema: {type: integer, minimum: 0}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm, expectedRevision]
              properties:
                confirm: {type: string, const: RESTORE_CHAPTER_REVISION}
                expectedRevision: {type: integer, minimum: 0}
      responses:
        '200': {description: 'ok=true, revision=nouvelle séquence, restoredFrom=ancienne séquence'}
        '400': {description: Confirmation/champs/numéro incorrect}
        '401': {description: Session absente}
        '403': {description: Origine de requête interdite}
        '404': {description: Livre/chapitre courant absent ou droits insuffisants}
        '409': {description: Conflit de version ou source de révision invalide}
        '413': {description: Corps JSON dépasse 2048 octets}
        '422': {description: La révision choisie est déjà la révision courante}
        '503': {description: Incident DB, aucun état partiel enregistré}


  /books/{bookId}/chapters/{chapterId}/revisions/compare:
    get:
      summary: Comparaison privée des textes enregistrés de deux révisions d'un chapitre actif
      description: >-
        Lecture seule après vérification de session, espace et édition courante du
        chapitre ; aucun appel IA. Sélection de deux révisions distinctes, dans
        l'ordre voulu, via from/to. Diff mot-à-mot et ponctuation au plus petit
        coût mémoire (préfixe/suffixe identiques puis LCS borné). Réponse en
        segments equal/added/removed, aucune balise HTML, hash de contenu ou
        lien de fichier. Preserve exactement les espaces et retours ligne,
        sans troncature. La comparaison porte sur le texte brut : les
        changements de style ne sont pas calculés ; formattingMayDiffer signale
        seulement un contenu structuré différent avec texte identique.
        Taille texte: 250000 caractères UTF-16/révision ; jusqu'à 12000 unités
        lexicales/révision ; max 4 millions de cases de comparaison pour le
        sous-texte variable. 422 si le budget est dépassé ; pas d'export
        tronqué ni dégradation silencieuse des données.
      parameters:
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: chapterId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: true, schema: {type: integer, minimum: 0}}
        - {name: to, in: query, required: true, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: 'chapterId, from/to (sequence, createdAt, authorName), comparison: counts, segments[], algorithm, formattingMayDiffer'}
        '400': {description: Révisions identiques, paramètre manquant/invalide ou duplication}
        '401': {description: Session absente}
        '404': {description: Livre inaccessible, chapitre hors édition courante ou numéro futur}
        '409': {description: Révision source incomplète/incohérente}
        '422': {description: Texte ou travail de comparaison hors limites, aucune troncature}
        '503': {description: Indisponibilité de comparaison temporaire}


  /books/{bookId}/duplicate:
    post:
      summary: Dupliquer un livre dans un ouvrage nouveau indépendant en Brouillon
      description: >-
        Session, rôle OWNER/EDITOR sur le workspace source et Origin anti-CSRF.
        Uniquement les chapitres ACTIFS de la dernière édition et leur dernière
        révision enregistrée, sans perte ni troncature. Nouveau Book DRAFT
        dans le même workspace, même type/langue, nouvelle Edition numéro 1,
        nouveaux identifiants de chapitres et DocumentRevision.sequence=0.
        Ni fichiers Supabase Storage ni sources importées, résultats de scans,
        commentaires, permissions, anciennes éditions ou snapshots sont copiés.
        Confirmation, expectedEditionId, expectedUpdatedAt, operationId UUID
        idempotent ; transaction Serializable et verrou sur le livre d'origine.
        Source inchangée. Limites 500 chapitres, 20 MiB JSON et texte cumulés.
      parameters:
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm, expectedEditionId, expectedUpdatedAt, operationId, title]
              properties:
                confirm: {type: string, const: DUPLICATE_BOOK_FROM_SAVED_EDITION}
                expectedEditionId: {type: string, format: uuid}
                expectedUpdatedAt: {type: string, format: date-time}
                operationId: {type: string, format: uuid}
                title: {type: string, minLength: 2, maxLength: 180}
      responses:
        '201': {description: Création, book id/title/chapterCount/editionId et replayed false}
        '200': {description: Reprise idempotente, book id/title et replayed true}
        '400': {description: Requête, date, identifiant, confirmation ou titre invalides}
        '401': {description: Session absente}
        '403': {description: Origine interdite}
        '404': {description: Livre absent, archivé ou rôle/workspace insuffisant}
        '409': {description: Livre ou édition concurrente ou source invalide}
        '413': {description: Corps JSON dépasse 4096 octets}
        '422': {description: Taille excessive, pas de copie partielle ou tronquée}
        '503': {description: Transaction échouée sans écriture partielle}


  /books/{bookId}/chapters/{chapterId}/duplicate:
    post:
      summary: Dupliquer la dernière révision sauvegardée d'un chapitre courant
      description: >-
        Session et membre OWNER/EDITOR du même workspace, Origin anti-CSRF.
        Confirmation explicite et operationId UUID idempotent. Transaction
        Serializable, lock sur livre et vérification édition actuelle,
        sequence revisionSeq et updatedAt du chapitre source. Crée un nouveau
        chapitre à la fin du manuscrit avec nouvel UUID et sequence 0, JSON
        et texte intégraux de la dernière révision enregistrée. Source intacte,
        Book.status remet à DRAFT. Aucun commentaire, snapshot, fichier
        Supabase, historique d'import, attestation antivirus ou permission
        copié. Max 500 chapitres actifs, 20 Mio JSON+texte sans troncature.
      parameters:
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: chapterId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm, expectedChapterUpdatedAt, expectedEditionId, expectedRevision, operationId, title]
              properties:
                confirm: {type: string, const: DUPLICATE_CHAPTER_FROM_SAVED}
                expectedChapterUpdatedAt: {type: string, format: date-time}
                expectedEditionId: {type: string, format: uuid}
                expectedRevision: {type: integer, minimum: 0}
                operationId: {type: string, format: uuid}
                title: {type: string, minLength: 2, maxLength: 180}
      responses:
        '201': {description: Nouveau chapter id/title/revision/position, replayed false}
        '200': {description: Reprise operationId idempotente, même chapter id, replayed true}
        '400': {description: UUID, titre, confirmation ou date incorrects}
        '401': {description: Non connecté}
        '403': {description: Origin interdit}
        '404': {description: Chapitre hors édition actuelle, workspace ou rôle non autorisé}
        '409': {description: Révision/horodatage/édition dépassé ou source incohérente}
        '413': {description: Corps de requête > 4096 octets}
        '422': {description: Plafond 500 chapitres ou 20 MiB atteint, sans troncature}
        '503': {description: Transaction échouée et annulée}


  /books/{bookId}/chapter-copy-targets:
    get:
      summary: Lister uniquement les ouvrages de destination modifiables du même workspace
      description: >-
        Session, OWNER/EDITOR sur le livre source, liste du même espace sans
        ouvrages archivés ni source, 50 maximum, recherche par titre insensible
        à la casse (search <= 100 caractères), hasMore si plus de 50 résultats.
        Ne renvoie ni prose de manuscrit ni URLs Supabase.
      parameters:
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: search, in: query, required: false, schema: {type: string, maxLength: 100}}
      responses:
        '200': {description: targets avec id/title/bookType/language/status et hasMore}
        '400': {description: Paramètre inconnu, dupliqué ou recherche trop longue}
        '401': {description: Non connecté}
        '404': {description: Livre source inaccessible ou droit insuffisant}
        '503': {description: Destinations indisponibles}
  /books/{bookId}/chapters/{chapterId}/copy-to-book:
    post:
      summary: Copier sans déplacer un chapitre enregistré dans un autre livre du même espace
      description: >-
        OWNER/EDITOR sur les deux livres du même workspace, session et Origin
        anti-CSRF. Confirmation forte et operationId UUID idempotent. Versions
        source et destination revérifiées sous deux verrous de livres ordonnés
        par UUID, transaction Serializable. Crée un chapitre indépendant
        à la fin de l'édition courante cible avec révision 0, contenu exact
        du dernier texte/JSON enregistré de la source, cible remise à DRAFT.
        Source intacte. Aucun commentaire, snapshot, source Supabase,
        import, fichier, permission ou attestation antivirus copié.
        Refus au-delà de 500 chapitres actifs destination ou 20 MiB de contenu.
      parameters:
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: chapterId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm, destinationBookId, expectedChapterUpdatedAt, expectedDestinationEditionId, expectedDestinationUpdatedAt, expectedRevision, expectedSourceEditionId, operationId, title]
              properties:
                confirm: {type: string, const: COPY_CHAPTER_TO_BOOK_SAVED_ONLY}
                destinationBookId: {type: string, format: uuid}
                expectedChapterUpdatedAt: {type: string, format: date-time}
                expectedDestinationEditionId: {type: string, format: uuid}
                expectedDestinationUpdatedAt: {type: string, format: date-time}
                expectedRevision: {type: integer, minimum: 0}
                expectedSourceEditionId: {type: string, format: uuid}
                operationId: {type: string, format: uuid}
                title: {type: string, minLength: 2, maxLength: 180}
      responses:
        '201': {description: Nouveau chapitre avec chapter id/title/revision/position, destinationBookId et replayed false}
        '200': {description: Replay idempotent avec le même chapitre cible, replayed true}
        '400': {description: Confirmation, titre, UUID, schéma ou destination identique invalides}
        '401': {description: Non connecté}
        '403': {description: Origin interdit}
        '404': {description: Livre source/destination inaccessible, autre workspace ou chapitre hors édition actuelle}
        '409': {description: Livres, révision ou éditions ont changé ; aucun effet partiel}
        '413': {description: Corps de requête > 4096 octets}
        '422': {description: Chapitres ou volume source hors limites, aucun texte tronqué}
        '503': {description: Transaction indisponible}


  /books/{bookId}/chapters/{chapterId}/merge:
    post:
      summary: Créer un troisième chapitre depuis deux révisions sauvegardées sans supprimer les sources
      description: >-
        Session, workspace OWNER/EDITOR et Origin anti-CSRF. Deux chapitres
        actifs et distincts de la dernière édition, premier toujours chapitre
        de l'URL, second explicite. Verrou du livre puis transaction Serializable.
        Préconditions de l'édition et des deux révisions/updatedAt. Concaténation
        exacte des blocs ProseMirror racines, sans HTML ni intervention IA,
        nouveau UUID, révision 0, dernière position et livre DRAFT. Source,
        commentaires, versions, snapshots, imports, Storage et preuves antivirus
        inchangés ; aucune permission ajoutée. Idempotence operationId UUID
        et audit sans prose avec hash de paramètres. Max 500 chapitres actifs,
        2 MiB JSON ProseMirror + complexité validateur, aucun texte tronqué.
      parameters:
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: chapterId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm, expectedEditionId, expectedFirstRevision, expectedFirstUpdatedAt, expectedSecondRevision, expectedSecondUpdatedAt, operationId, secondChapterId, title]
              properties:
                confirm: {type: string, const: MERGE_SAVED_CHAPTERS_AS_NEW}
                secondChapterId: {type: string, format: uuid}
                operationId: {type: string, format: uuid}
                title: {type: string, minLength: 2, maxLength: 180}
                expectedEditionId: {type: string, format: uuid}
                expectedFirstRevision: {type: integer, minimum: 0}
                expectedFirstUpdatedAt: {type: string, format: date-time}
                expectedSecondRevision: {type: integer, minimum: 0}
                expectedSecondUpdatedAt: {type: string, format: date-time}
      responses:
        '201': {description: Nouveau chapitre id/title/revision/position, bookId et replayed false}
        '200': {description: Replay idempotent du même operationId et de la même instruction, replayed true}
        '400': {description: Schéma, titre, confirmation, UUID invalides ou deux chapitres identiques}
        '401': {description: Session absente}
        '403': {description: Origine non autorisée}
        '404': {description: Livre/chapitre inaccessible ou ancienne édition}
        '409': {description: Révision, date ou édition obsolète, source invalide ou operationId repris avec autre instruction}
        '413': {description: Corps requête dépasse 4096 octets}
        '422': {description: Plafond 500 chapitres ou 2 MiB/20k nœuds, rien tronqué}
        '503': {description: Transaction interrompue et annulée sans copie partielle}

# BookStudio AI v0.36.0-alpha / BS-005a #176 — no new API endpoints.
# Chapter find/replace is intentionally client-side only in the open Tiptap
# editor; all edits still use the existing revision-precondition PATCH
# /books/{bookId}/chapters/{chapterId} after ProseMirror local validation,
# with ordinary session/workspace ACL, Origin and optimistic concurrency.
# No search phrase or draft is transmitted to a new API or AI provider.
# Globally scoped /search remains read-only and unchanged in this release.


  /search:
    get:
      summary: Recherche privée dans les derniers chapitres sauvegardés, globale ou limitée à un ouvrage
      description: >-
        Session obligatoire. q littéral 2–80 caractères, métacaractères LIKE
        échappés et paramètres stricts (pas de doublons). bookId facultatif :
        scope limité au livre non archivé dont le demandeur est membre de
        l'espace ; titre et contenu d'un ouvrage inaccessible ne sont jamais
        révélés (404). offset facultatif : multiple de 30, entre 0 et 30000.
        Recherche uniquement la DocumentRevision de revisionSeq de chaque
        chapitre actif de l'édition courante. Exclut archives, autres tenants,
        anciennes éditions, chapitres retirés, brouillons non sauvegardés.
        30 résultats maximum avec hasMore, nextOffset, scope et extrait court
        de 220 caractères ; cache privé no-store. Aucun nouvel index externe.
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 2, maxLength: 80}
          description: Terme littéral, insensible à la casse, pas de regex.
        - name: bookId
          in: query
          required: false
          schema: {type: string, format: uuid}
          description: Limiter la recherche à ce livre autorisé.
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, maximum: 30000, multipleOf: 30, default: 0}
          description: Offset page suivante fourni par nextOffset.
      responses:
        '200':
          description: >-
            query, bookId, bookTitle ou null, hits[] de chapitres avec
            bookId/bookTitle/chapterId/chapterTitle/revision/snippet/updatedAt,
            offset, pageSize 30, nextOffset null ou entier, hasMore,
            limitedTo 30 et scope. Pas de contenu complet.
        '400': {description: Terme/UUID/offset invalide, paramètre dupliqué ou inconnu}
        '401': {description: Session absente ou expirée}
        '404': {description: Ouvrage ciblé archivé, inexistant ou non autorisé}
        '503': {description: Recherche momentanément indisponible}

# v0.38.0-alpha / BS-005c #183 — NO NEW API ENDPOINT.
# Live H1/H2/H3 section outlines are derived ONLY from the current in-memory
# Tiptap/ProseMirror editor document. No API, AI provider, background job,
# snapshot mutation, save, permission change, or data-leak surface added.
# Existing chapter revision PATCH and same-workspace READ contracts unchanged.

  /books/{bookId}/chapters/{chapterId}/outline:
    get:
      summary: Titres H1–H3 sauvegardés d'un chapitre courant, en lecture seule (v0.40)
      description: >-
        Session active et accès au livre privé non archivé obligatoires. Le chapitre
        doit être actif dans le manuscrit de l'édition la plus récente. Extrait
        uniquement les titres H1/H2/H3 non vides de DocumentRevision à la
        séquence revisionSeq, sans aucun paragraphe, contenu JSON complet, ancien
        état, brouillon, commentaire ni fichier. Ordinal stable et absolu dans
        la révision courante, même lorsque le filtre réduit les résultats.
        Réponse privée sans cache et lecture sans écriture. 60 titres au maximum
        par page et signalement explicite hasMore/total.
      parameters:
        - name: bookId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: chapterId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: filter
          in: query
          schema: {type: string, maxLength: 100, default: ''}
          description: Filtre littéral Unicode insensible à la casse ; caractères de contrôle rejetés.
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        '200':
          description: >-
            chapterId, revision, headings[] avec ordinal/level/title, total des
            correspondances et hasMore. Aucune prose ni arbre ProseMirror.
        '400': {description: Filtre ou offset invalide}
        '401': {description: Session absente/expirée}
        '404': {description: Livre ou chapitre inaccessible, archivé, supprimé ou historique}
        '503': {description: Révision absente ou service indisponible}
