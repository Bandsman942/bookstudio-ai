openapi: 3.1.0
info:
  title: BookStudio AI API
  version: 0.1.0
  description: API autonome, aucune connexion directe à DTSC Platform.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      summary: Authentification locale
      responses:
        '200': {description: Session établie}
        '401': {description: Identifiants invalides}
  /auth/logout:
    post:
      summary: Révoquer la session
      responses:
        '200': {description: Révoquée}
  /books:
    get:
      summary: Bibliothèque privée paginée avec recherche de titre et filtres
      description: >-
        Ne retourne que les livres dont l'utilisateur courant est membre de l'espace.
        Curseur keyset lié aux filtres, tri déterministe; statistiques de la
        bibliothèque accessibles indépendantes de la page demandée.
      parameters:
        - name: archived
          in: query
          schema: {type: string, const: '1'}
          description: Archives réversibles uniquement; absence = livres actifs
        - name: editable
          in: query
          schema: {type: string, const: '1'}
          description: Filtre OWNER ou EDITOR pour la destination des imports
        - name: q
          in: query
          schema: {type: string, maxLength: 80}
          description: Texte recherché dans le titre (insensible à la casse)
        - name: type
          in: query
          schema: {type: string, enum: [GENERAL,NOVEL,ESSAY,SCIENCE,MEDICINE,EDUCATION]}
        - name: status
          in: query
          schema: {type: string, enum: [DRAFT,WRITING,REVIEW,APPROVED,PRODUCTION,PUBLISHED]}
        - name: sort
          in: query
          schema: {type: string, enum: [recent,title], default: recent}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
          description: UI bibliothèque utilise 24; absence garde la compatibilité 100
        - name: cursor
          in: query
          schema: {type: string, maxLength: 850}
          description: Curseur renvoyé par la page précédente et valable pour les mêmes filtres
      responses:
        '200': {description: 'books[], total filtré, nextCursor (ou null), stats globales (total/writing/review, archived, byStatus des six étapes)'}
        '400': {description: 'Filtre, limite ou curseur invalide/non applicable'}
        '401': {description: Non authentifié}
        '503': {description: Lecture temporairement indisponible}
    post:
      summary: Créer un livre, une édition et un premier chapitre
      responses:
        '201': {description: Créé}
  /books/{bookId}/chapters:
    post:
      summary: Ajouter un chapitre
      parameters:
        - name: bookId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '201': {description: Créé}
  /books/{bookId}/chapters/{chapterId}:
    get:
      summary: Lire la révision courante
      parameters:
        - name: bookId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: chapterId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Contenu structuré}
        '404': {description: Introuvable ou inaccessible}
    patch:
      summary: Sauvegarde optimiste
      parameters:
        - name: bookId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: chapterId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseRevision,content]
              properties:
                baseRevision: {type: integer, minimum: 0}
                content: {type: object}
      responses:
        '200': {description: Révision incrémentée}
        '409': {description: Conflit de révision}

  /books/{bookId}/chapters/reorder:
    patch:
      summary: Déplacer un chapitre d'une position (OWNER/EDITOR uniquement)
      description: >-
        Conserve le texte, les révisions, commentaires et snapshots. Compare
        expectedOrderToken à l'ordre courant des chapitres actifs ; 409 si une
        autre modification est intervenue. Transaction sérialisable et audit.
      parameters:
        - name: bookId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [chapterId, direction, expectedOrderToken]
              properties:
                chapterId: {type: string, format: uuid}
                direction: {type: string, enum: [up, down]}
                expectedOrderToken: {type: string, minLength: 64, maxLength: 64, pattern: '^[0-9a-f]{64}$'}
      responses:
        '200': {description: 'Ordre mis à jour ou déplacement impossible aux extrémités (changed=false), nouveau orderToken'}
        '400': {description: Paramètres non valides}
        '401': {description: Non authentifié}
        '403': {description: Origine CSRF refusée}
        '404': {description: Non membre ou livre/chapitre inaccessible}
        '409': {description: Ordre modifié par une autre session}
        '422': {description: Structure trop volumineuse}
        '503': {description: Incident temporaire, aucune décision partielle commitée}

  /books/{bookId}:
    patch:
      summary: Gérer titre, archivage, propriétés ou statut éditorial d'un livre
      description: >-
        Session + RBAC OWNER/EDITOR, CSRF par Origin, livre/espace vérifié,
        expectedUpdatedAt obligatoire, transaction Serializable et audit.
        Le statut éditorial déclaré manuellement ne publie rien.
      parameters:
        - name: bookId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action,expectedUpdatedAt,bookType,language]
                  properties:
                    action: {type: string, const: properties}
                    expectedUpdatedAt: {type: string, format: date-time}
                    bookType: {type: string, enum: [GENERAL,NOVEL,ESSAY,SCIENCE,MEDICINE,EDUCATION]}
                    language: {type: string, enum: [fr,en]}
                - type: object
                  required: [action,expectedUpdatedAt,status]
                  properties:
                    action: {type: string, const: status}
                    expectedUpdatedAt: {type: string, format: date-time}
                    status: {type: string, enum: [DRAFT,WRITING,REVIEW,APPROVED,PRODUCTION,PUBLISHED]}
                - type: object
                  required: [action,expectedUpdatedAt]
                  properties:
                    action: {type: string, enum: [rename,archive,restore]}
                    expectedUpdatedAt: {type: string, format: date-time}
                    title: {type: string, minLength: 2, maxLength: 180}
      responses:
        '200': {description: Métadonnées enregistrées ou unchanged=true}
        '400': {description: Type, langue, statut ou autre paramètre invalide}
        '401': {description: Non authentifié}
        '403': {description: Origine CSRF refusée}
        '404': {description: Livre absent/inaccessible, statut interdit sur livre archivé}
        '409': {description: Conflit de métadonnées ou d'archivage}
        '413': {description: Corps de requête trop grand}
        '422': {description: Transition éditoriale non autorisée}
        '503': {description: Échec transactionnel temporaire}

  /books/{bookId}/progress:
    get:
      summary: Indicateurs privés de progression de l'ouvrage actif
      description: >-
        Réautorise la session et l'appartenance au workspace. Utilise la dernière
        révision enregistrée de chaque chapitre actif de l'édition courante et
        ne renvoie aucun texte ni fichier source. Le pourcentage signifie
        « chapitres contenant du texte », pas « achèvement éditorial ».
      parameters:
        - name: bookId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: 'progress: editionNumber, activeChapters, writtenChapters, emptyChapters, writingCoveragePercent, removedChapters, revisionRecords, snapshots, lastRevisionAt, latestChapter, chapterStates'}
        '401': {description: Non authentifié}
        '404': {description: Livre absent, archivé ou extérieur au workspace}
        '503': {description: Statistiques indisponibles temporairement, édition du livre toujours possible}

  /books/{bookId}/editions:
    get:
      summary: Catalogue des éditions privées d'un ouvrage non archivé
      description: Session active et appartenance au workspace requises. Métadonnées seulement, sans prose manuscrite ni sources.
      parameters:
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 'editions[], currentEditionId, expectedUpdatedAt, status'}
        '401': {description: Non authentifié}
        '404': {description: Livre absent ou non autorisé}
        '503': {description: Base temporairement indisponible}
    post:
      summary: Créer l'édition suivante à partir du dernier texte enregistré
      description: >-
        OWNER/EDITOR seulement, Origin CSRF strict, copie atomique Serializable
        des chapitres actifs et dernières révisions en nouveaux identifiants.
        Ne copie pas commentaires, imports ou scans, ne modifie jamais les anciennes
        révisions ni snapshots. Le statut du livre revient à DRAFT. Capacité
        synchrone maximale 500 chapitres et 20 MiB de contenu.
      parameters:
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm,expectedEditionId,expectedUpdatedAt]
              properties:
                confirm: {type: string, const: CREATE_EDITION_FROM_SAVED}
                expectedEditionId: {type: string, format: uuid}
                expectedUpdatedAt: {type: string, format: date-time}
      responses:
        '201': {description: Nouvelle édition et nombre de chapitres copiés}
        '400': {description: Confirmation ou corps invalide}
        '401': {description: Non authentifié}
        '403': {description: Origine non autorisée}
        '404': {description: Livre inaccessible ou non modifiable}
        '409': {description: Édition modifiée ou source incohérente}
        '413': {description: Requête trop volumineuse}
        '422': {description: Plus de 500 chapitres ou 20 MiB — traitement direct indisponible}
        '503': {description: Erreur d'opération temporaire}
  /books/{bookId}/editions/{editionId}:
    get:
      summary: Sommaire historique d'une édition (lecture seule)
      parameters:
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: editionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Édition et chapitres actifs avec métadonnées seulement}
        '401': {description: Non authentifié}
        '404': {description: Édition absente ou non autorisée}
        '503': {description: Lecture indisponible}
  /books/{bookId}/editions/{editionId}/chapters/{chapterId}:
    get:
      summary: Dernier texte enregistré d'un ancien chapitre (lecture seule)
      description: Session et accès au livre réautorisés ; aucun HTML ni opération de mutation.
      parameters:
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: editionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: chapterId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 'chapter: titre, révision, texte brut, date d’enregistrement'}
        '401': {description: Non authentifié}
        '404': {description: Chapitre/édition non autorisé ou absent}
        '409': {description: Source du chapitre incohérente}
        '503': {description: Lecture temporairement indisponible}

  /books/{bookId}/editions/compare:
    get:
      summary: Comparaison privée des métadonnées et empreintes de deux éditions
      description: >-
        Membres autorisés du livre non archivé seulement. L'API lit les dernières
        empreintes des chapitres actifs de deux éditions du MÊME ouvrage et ne
        renvoie ni prose, ni JSON ProseMirror, ni hash de contenu. Elle rapporte
        les rapprochements certains par preuves uniques et les ambiguïtés
        sous forme d'ajouts et absences, sans inventer une filiation éditoriale.
      parameters:
        - {name: bookId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: to, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: "fromEdition, toEdition, comparison avec counts/pairs/added/removed/limitations (sans texte, hash ni URL)"}
        '400': {description: Edition absente ou identique / paramètre invalide}
        '401': {description: Non authentifié}
        '404': {description: Livre ou éditions absents/hors workspace}
        '409': {description: Dernière révision d'un chapitre incohérente}
        '422': {description: Plus de 350 chapitres actifs dans une édition}
        '503': {description: Comparaison temporairement indisponible}
